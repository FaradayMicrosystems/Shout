name: Android build

on:
  push:
    branches: [main, experimental]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Signing: this repo is public, so the key is NOT committed. Optional repository secrets:
      #   KEYSTORE_BASE64 (base64 of a .jks), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      # With them every build signs the same and updates install over each other.
      # Without them each build uses a throwaway debug key (uninstall the old version first).
      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          : > local.properties
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > shout.jks
            { echo "KEYSTORE_FILE=shout.jks"; echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"; echo "KEY_ALIAS=$KEY_ALIAS"; echo "KEY_PASSWORD=$KEY_PASSWORD"; } >> local.properties
            SIGN="shared Shout key (updates install over each other)"
          else
            SIGN="throwaway debug key: uninstall the old version first"
          fi
          echo "BUILD_STATUS=Signed with: $SIGN." >> "$GITHUB_ENV"
          echo "Signing: $SIGN"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: shout-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Release channels (same as Truckie):
      #   main          stable. Its version ("0.1.0") publishes as the full release v0.1.0.
      #   experimental  every push publishes a pre-release v0.1.1e+<build>; the fixed page
      #                 releases/tag/experimental always holds only the newest one.
      - name: Publish release
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/experimental') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          BASE=$(sed -n 's/^val baseVersionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          [ -n "$BASE" ] || { echo "::error::baseVersionName not found in app/build.gradle.kts"; exit 1; }
          case "$BASE" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::version must be X.Y.Z with an optional letter, found $BASE"; exit 1 ;; esac
          STABLE="${BASE%[abce]}"
          awk -v h="## v$STABLE " 'index($0, h) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          printf '\n%s\n' "$BUILD_STATUS" >> notes.md

          if [ "$BRANCH" = "experimental" ]; then
            case "$BASE" in *e) ;; *) echo "::error::experimental must build an e version (e.g. 0.1.1e), found $BASE"; exit 1 ;; esac
            TAG="v$BASE+$GITHUB_RUN_NUMBER"
            APK="shout-v$BASE-build$GITHUB_RUN_NUMBER.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "$APK"
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Shout $TAG (experimental)" --notes-file notes.md
            NOTES="Newest experimental build, $TAG. Same file as that release. $BUILD_STATUS"
            if gh release view experimental > /dev/null 2>&1; then
              for old in $(gh release view experimental --json assets --jq '.assets[].name'); do
                [ "$old" = "$APK" ] || gh release delete-asset experimental "$old" --yes
              done
              gh release upload experimental "$APK" --clobber
              gh release edit experimental --title "Experimental: newest build ($TAG)" --notes "$NOTES"
            else
              gh release create experimental "$APK" --target "$GITHUB_SHA" --prerelease --latest=false \
                --title "Experimental: newest build ($TAG)" --notes "$NOTES"
            fi
            exit 0
          fi

          case "$BASE" in *[abce]) echo "::error::main holds stable releases only; drop the letter before a full release (found $BASE)"; exit 1 ;; esac
          TAG="v$BASE"
          cp app/build/outputs/apk/debug/app-debug.apk "shout-$TAG.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "shout-$TAG.apk" --clobber
            gh release edit "$TAG" --notes-file notes.md
            exit 0
          fi
          gh release create "$TAG" "shout-$TAG.apk" --target "$GITHUB_SHA" --latest \
            --title "Shout $TAG" --notes-file notes.md
